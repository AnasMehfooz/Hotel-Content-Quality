[project]
name = "hotel-content-quality"
version = "0.1.0"
description = "Data-quality pipeline for hotel content feeds: dbt + DuckDB checks, Dagster orchestration and a local-LLM triage agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.13,<1.14",
    "dagster-dbt>=0.29,<0.30",
    "dagster-webserver>=1.13,<1.14",
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "duckdb>=1.5,<1.6",
    "httpx>=0.28",
    "numpy>=2.5",
    "pandas>=3.0,<4",
    "pyarrow>=26",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "rapidfuzz>=3.14",
    "rich>=15",
    "streamlit>=1.66",
    "typer>=0.27",
]

[project.scripts]
hcq = "hcq.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcq"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # the formatter owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live_llm: needs a running Ollama server (set HCQ_LIVE_LLM=1)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
